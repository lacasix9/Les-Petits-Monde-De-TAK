
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Telecharger Gradle 8.10.2
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Compiler le jeu
        run: ./gradle-8.10.2/bin/gradle --no-daemon assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-Petits-Monde-De-TAK
          path: app/build/outputs/apk/debug/app-debug.apk
          
