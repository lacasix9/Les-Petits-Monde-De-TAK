
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.10.2
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Compiler APK debug
        run: gradle --no-daemon assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-Petits-Monde-De-TAK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
